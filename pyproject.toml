[project]
name = "cli-llm-bridge"
version = "0.1.0"
description = "OpenAI- and Anthropic-compatible local HTTP API that runs your own Claude Code CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
cli-llm-bridge = "cli_llm_bridge:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli_llm_bridge"]
